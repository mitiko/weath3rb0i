[package]
name = "weath3rb0i"
version = "0.1.0"
edition = "2021"
authors = ["Dimitar Rusev <mitikodev@gmail.com>"]
description = "CM text compressor"
repository = "https://github.com/mitiko/weath3rb0i/"
license = "GPL-3.0"
keywords = ["compressor", "context_mixing"]
categories = ["compression"]

default-run = "weath3rb0i"

[lib]
crate-type = ["cdylib", "rlib"] # cdylib for wasm, rlib for the bins and tests

[dependencies]
serde_json = "1.0.151"

# rayon has no threads to use on wasm, and the viewer never needs it
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.9.0" # MT only used for search, compression is single threaded

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# rustc emits these by default, but wasm-opt does not enable them unless told
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext']

[profile.dev]
opt-level = 1

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[features]
default = []
unsafe_conversions = []

[[bin]]
name = "order0"
[[bin]]
name = "ac-over-huffman"
[[bin]]
name = "cmp"
[[bin]]
name = "ordern"
[[bin]]
name = "entropy-hashing-ac"
[[bin]]
name = "entropy-hashing-huff"
